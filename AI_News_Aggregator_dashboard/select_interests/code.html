<script>
        function toggleSelection(element) {
            element.classList.toggle('selected');
            
            // Subtle feedback: update progress bar slightly
            const selectedCount = document.querySelectorAll('.category-card.selected').length;
            const progressBar = document.getElementById('progress-bar');
            const baseProgress = 65;
            const bonusProgress = Math.min(selectedCount * 4, 35);
            progressBar.style.width = (baseProgress + bonusProgress) + '%';
        }

        function finishSetup(button) {
            const selectedCount = document.querySelectorAll('.category-card.selected').length;
            if (selectedCount === 0) {
                alert('Please select at least one interest to personalize your feed.');
                return;
            }
            
            // Animate transition
            const btn = button;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
            btn.style.pointerEvents = 'none';
            
            setTimeout(() => {
                const progressBar = document.getElementById('progress-bar');
                progressBar.style.width = '100%';
                setTimeout(() => {
                    const selectedInterests = [...document.querySelectorAll('.category-card.selected h3')].map((item) => item.textContent.trim());
                    window.localStorage.setItem('newswiseInterests', JSON.stringify(selectedInterests));
                    window.localStorage.setItem('newswiseSetupComplete', '1');
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s ease-out';
                    window.location.href = '../newswise_home/code.html';
                }, 400);
            }, 1200);
        }
    </script>
