name: CI

# Runs the automated tests on every push (any branch) and on pull requests to
# main, so a change that breaks the system is caught before it is deployed.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (same as the server image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Check that every Python file compiles
        run: python -m compileall -q app

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend tests and build (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18 (same as the server image)
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true

      - name: Build frontend
        run: npm run build
        env:
          CI: true
