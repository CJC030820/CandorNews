# Production stack for a single server.
# Run on the server from the project folder:
#   docker compose --env-file deploy/production.env -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from the internet (ports 80/443). The backend,
# frontend and MongoDB talk to each other on the private Docker network.
# Tuned to fit a 1 GB server (Azure B1s / B2ats v2) with a swap file.
# Each container has a memory cap: if one grows too large, only that
# container is restarted instead of the whole server running out of memory.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/production.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    mem_limit: 128m
    restart: unless-stopped

  backend:
    build: ./backend
    logging: *default-logging
    env_file:
      - ./deploy/production.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
    volumes:
      - image_cache:/app/image_cache
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped
    # Keep exactly one backend container: refresh jobs and the email
    # scheduler run inside this single process.

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        # Empty = the browser calls the same site, e.g. https://DOMAIN/api/...
        REACT_APP_API_URL: ""
    mem_limit: 64m
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    logging: *default-logging
    # Small cache so MongoDB fits next to the app on a 1 GB server.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb_data:/data/db
    # Lightweight check: is MongoDB accepting connections? (about 5 ms).
    # The previous mongosh check used ~100 MB per run; on a busy 1 GB server
    # overrunning checks piled up and exhausted memory (2026-11-19 outage).
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 450m
    restart: unless-stopped

volumes:
  mongodb_data:
  image_cache:
  caddy_data:
  caddy_config:
